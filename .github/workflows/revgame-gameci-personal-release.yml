name: RevGame GameCI 通用出包流程

on:
  workflow_call:
    inputs:
      platform:
        description: 来自手动入口的固定构建目标
        required: true
        type: string
      import_only:
        description: 对相同目标执行导入验证并预热缓存
        type: boolean
        default: false
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      REVGAME_ANDROID_KEYSTORE_B64:
        required: false
      REVGAME_ANDROID_STORE_PASS:
        required: false
      REVGAME_ANDROID_KEY_ALIAS:
        required: false
      REVGAME_ANDROID_KEY_PASS:
        required: false

permissions:
  contents: read

concurrency:
  group: revgame-gameci-personal-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.import_only && 'GameCI 导入预热' || 'GameCI 正式包' }} ${{ inputs.platform }}
    if: github.repository == 'Yokino337088/RevGame' && github.ref == 'refs/heads/main' && (inputs.platform == 'windows' || inputs.platform == 'android')
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || 'ubuntu-22.04' }}
    timeout-minutes: 320
    env:
      REVGAME_TARGET: ${{ inputs.platform }}
      REVGAME_BUILD_TARGET: ${{ inputs.platform == 'windows' && 'StandaloneWindows64' || 'Android' }}
      REVGAME_EDITOR_IMAGE: ${{ inputs.platform == 'windows' && 'unityci/editor@sha256:b3be4bb2ac15241bf932efa0f5d00d2f93f41afadc74a4b07656985fb7113ea2' || 'unityci/editor@sha256:509ad2bbc977d029a9c8d642f1b6cc10f42e2d66e307befa73ebe359a3db58a9' }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: 检查授权和目标签名
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          REVGAME_ANDROID_SIGNING_REQUIRED: ${{ inputs.platform == 'android' && !inputs.import_only }}
          REVGAME_ANDROID_KEYSTORE_B64: ${{ inputs.platform == 'android' && secrets.REVGAME_ANDROID_KEYSTORE_B64 || '' }}
          REVGAME_ANDROID_STORE_PASS: ${{ inputs.platform == 'android' && secrets.REVGAME_ANDROID_STORE_PASS || '' }}
          REVGAME_ANDROID_KEY_ALIAS: ${{ inputs.platform == 'android' && secrets.REVGAME_ANDROID_KEY_ALIAS || '' }}
          REVGAME_ANDROID_KEY_PASS: ${{ inputs.platform == 'android' && secrets.REVGAME_ANDROID_KEY_PASS || '' }}
        run: |
          $required = @('UNITY_LICENSE','UNITY_EMAIL','UNITY_PASSWORD')
          if ($env:REVGAME_ANDROID_SIGNING_REQUIRED -eq 'true') {
            $required += @('REVGAME_ANDROID_KEYSTORE_B64','REVGAME_ANDROID_STORE_PASS','REVGAME_ANDROID_KEY_ALIAS','REVGAME_ANDROID_KEY_PASS')
          }
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "请配置 Actions Secrets $($missing -join ', ')"
          }

      - name: 等待 Windows 容器服务就绪
        if: inputs.platform == 'windows'
        shell: pwsh
        # 某些托管 Windows runner 在分配任务后 Docker 服务仍然停止，先确认服务端可以响应。
        run: |
          $deadline = [DateTime]::UtcNow.AddSeconds(90)
          do {
            $service = Get-Service -Name docker -ErrorAction Stop
            if ($service.Status -eq 'Stopped') {
              Start-Service -Name docker -ErrorAction SilentlyContinue
            }
            $dockerOs = docker version --format '{{.Server.Os}}' 2>$null
            if ($LASTEXITCODE -eq 0 -and $dockerOs -eq 'windows') {
              Write-Output 'Windows Docker 服务已就绪。'
              return
            }
            Start-Sleep -Seconds 5
          } while ([DateTime]::UtcNow -lt $deadline)
          throw "Windows Docker 服务在 90 秒内未就绪，最后一次服务状态为 $($service.Status)。"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 核对已提交 AB 并隔离其它平台资源
        id: prepare
        run: python -B tools/UnityCI/gameci_release.py prepare --target ${{ inputs.platform }}

      - name: 计算 Unity 导入缓存键
        id: import-cache-key
        shell: pwsh
        continue-on-error: true
        env:
          # 将工作流改动和普通资源变动留在兼容范围内，由 Unity 检查实际变更的导入输入。
          REVGAME_IMPORT_COMPATIBILITY: ${{ hashFiles('RevGame_Client/UnityProject/RevGame.Unity/Packages/**', 'RevGame_Client/UnityProject/RevGame.Unity/ProjectSettings/**') }}
          REVGAME_IMPORT_ENTRY: ${{ hashFiles('tools/UnityCI/RevGameGameCiRelease.cs') }}
        run: |
          $assets = git rev-parse HEAD:RevGame_Client/UnityProject/RevGame.Unity/Assets
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $image = ($env:REVGAME_EDITOR_IMAGE -split '@sha256:')[-1]
          $prefix = "revgame-import-v2-$($env:RUNNER_OS)-$($env:RUNNER_ARCH)-$($env:REVGAME_TARGET)-$image-$($env:REVGAME_IMPORT_COMPATIBILITY)-"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value @("key=$prefix$assets-$env:REVGAME_IMPORT_ENTRY", "prefix=$prefix")

      - name: 复用本平台 Unity 资源导入缓存
        id: import-cache
        if: steps.import-cache-key.outputs.key != ''
        uses: actions/cache@v5
        continue-on-error: true
        with:
          # 精确保留资源导入产物和索引。Gradle 工作区、Player 产物和签名文件留在本轮 runner。
          path: |
            RevGame_Client/UnityProject/RevGame.Unity/Library/Artifacts
            RevGame_Client/UnityProject/RevGame.Unity/Library/ArtifactDB
            RevGame_Client/UnityProject/RevGame.Unity/Library/SourceAssetDB
          key: ${{ steps.import-cache-key.outputs.key }}
          restore-keys: ${{ steps.import-cache-key.outputs.prefix }}

      - name: ${{ inputs.import_only && '验证 Unity 导入并预热缓存' || '激活个人版并使用现有 AB 构建 Player' }}
        # 固定支持 Node.js 24 的 GameCI v5.0.1 发布提交，两个平台各自使用实际编辑器模块。
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.15f1
          projectPath: RevGame_Client/UnityProject/RevGame.Unity
          targetPlatform: ${{ env.REVGAME_BUILD_TARGET }}
          customImage: ${{ env.REVGAME_EDITOR_IMAGE }}
          buildMethod: ${{ inputs.import_only && 'RevGame.Editor.RevGameGameCiRelease.VerifyImport' || 'RevGame.Editor.RevGameGameCiRelease.Build' }}
          buildName: RevGame
          buildsPath: build
          versioning: None
          allowDirtyBuild: true
          androidKeystoreName: ${{ inputs.platform == 'android' && !inputs.import_only && 'revgame-gameci-release.keystore' || '' }}
          androidKeystoreBase64: ${{ inputs.platform == 'android' && !inputs.import_only && secrets.REVGAME_ANDROID_KEYSTORE_B64 || '' }}
          androidKeystorePass: ${{ inputs.platform == 'android' && !inputs.import_only && secrets.REVGAME_ANDROID_STORE_PASS || '' }}
          androidKeyaliasName: ${{ inputs.platform == 'android' && !inputs.import_only && secrets.REVGAME_ANDROID_KEY_ALIAS || '' }}
          androidKeyaliasPass: ${{ inputs.platform == 'android' && !inputs.import_only && secrets.REVGAME_ANDROID_KEY_PASS || '' }}

      - name: 核对本轮导入回执和资产缓存
        if: inputs.import_only
        shell: pwsh
        env:
          REVGAME_IMPORT_CACHE_HIT: ${{ steps.import-cache.outputs.cache-hit }}
        run: |
          $library = 'RevGame_Client/UnityProject/RevGame.Unity/Library'
          $receipt = Get-Content -LiteralPath "$library/RevGameGameCiImport.txt"
          if ($receipt[0] -cne '2022.3.15f1' -or $receipt[1] -cne $env:REVGAME_BUILD_TARGET -or $receipt[2] -notmatch '^[0-9a-f]{32}$') {
            throw 'Unity 导入回执不符。'
          }
          foreach ($path in @('Artifacts', 'ArtifactDB', 'SourceAssetDB')) {
            if (!(Test-Path -LiteralPath "$library/$path")) {
              throw "Unity 导入缓存缺失 $path"
            }
          }
          Write-Output "Unity 导入验证通过，精确缓存命中=$env:REVGAME_IMPORT_CACHE_HIT"

      - name: 核验 IL2CPP、原生库及 AB
        if: '!inputs.import_only'
        run: python -B tools/UnityCI/gameci_release.py verify --target ${{ inputs.platform }}

      - name: 恢复平台资源并清除临时签名
        if: always() && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure')
        run: python -B tools/UnityCI/gameci_release.py restore --target ${{ inputs.platform }}

      - uses: actions/upload-artifact@v6
        if: '!inputs.import_only'
        with:
          name: RevGame-gameci-${{ inputs.platform }}-il2cpp-${{ github.sha }}
          path: build/${{ env.REVGAME_BUILD_TARGET }}/
          if-no-files-found: error
          retention-days: 3
