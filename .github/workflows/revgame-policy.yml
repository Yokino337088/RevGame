name: RevGame 规范检查

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revgame-policy:
    name: revgame-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 检查 Codex 插件市场清单
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path('.agents/plugins/marketplace.json')
          try:
              json.loads(manifest.read_text(encoding='utf-8'))
          except json.JSONDecodeError as error:
              print(f'::error file={manifest.as_posix()},line={error.lineno},col={error.colno}::{error.msg}')
              raise SystemExit(1)
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 检查提交涉及的资产和代码
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          python tools/RevPolicy/check.py --base "$BASE_SHA" --format github
