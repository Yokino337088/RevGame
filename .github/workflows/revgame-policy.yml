name: RevGame 规范检查

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revgame-policy:
    name: revgame-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 检查 Codex 插件市场清单
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path('.agents/plugins/marketplace.json')
          try:
              json.loads(manifest.read_text(encoding='utf-8'))
          except json.JSONDecodeError as error:
              print(f'::error file={manifest.as_posix()},line={error.lineno},col={error.colno}::{error.msg}')
              raise SystemExit(1)
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 检查提交涉及的资产和代码
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            checker="$(mktemp -d)"
            trap 'rm -r -- "$checker"' EXIT
            git archive "$BASE_SHA" tools/RevPolicy | tar -xC "$checker"
            python -B -m unittest discover -s "$checker/tools/RevPolicy" -p test_layout.py
            python "$checker/tools/RevPolicy/check.py" --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --policy-from-base --format github
          else
            python -B -m unittest discover -s tools/RevPolicy -p test_layout.py
            python tools/RevPolicy/check.py --base "$BASE_SHA" --format github
          fi
  offline-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 远征规则全量回归
        run: dotnet run --project RevGame_Client/Tests/CombatAttackRegression/CombatAttackRegression.csproj -c Release
      - name: 围棋规则回归
        run: dotnet run --project tools/PvpRulesChecks/PvpRulesChecks.csproj -c Release
  duel-prediction:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 原生决斗预测回归
        run: dotnet run --project tools/DuelPredictionChecks/DuelPredictionChecks.csproj -c Release
