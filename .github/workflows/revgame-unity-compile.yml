name: RevGame Unity 编译

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revgame-unity-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revgame-unity-compile:
    name: revgame-unity-compile
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      UNITY_VERSION: 2022.3.15f1c1
      UNITY_REVISION: 18739dc7bca8
      UNITY_PROJECT: RevGame_Client/UnityProject/RevGame.Unity
    steps:
      - name: 确认 CI 授权已配置
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UNITY_LICENSE)) {
            Write-Output '::error title=Unity CI 授权缺失::请配置适用于 CI runner 的 UNITY_LICENSE。来自 fork 的 PR 无法读取此仓库 Secret，请由维护者审阅后在本仓库分支提交 PR。'
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装固定版本的 Unity Editor
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'RevGameUnity'
          $installer = Join-Path $env:RUNNER_TEMP 'UnitySetup64.exe'
          $url = "https://download.unitychina.cn/download_unity/$env:UNITY_REVISION/Windows64EditorInstaller/UnitySetup64.exe"
          curl.exe --fail --location --silent --show-error --retry 3 --max-time 720 --output $installer $url
          if ($LASTEXITCODE -ne 0) { throw '下载 Unity Editor 安装包失败。' }
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -WindowStyle Hidden -PassThru -Wait
          $editor = Join-Path $installDir 'Editor/Unity.exe'
          if ($install.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $editor -PathType Leaf)) {
            throw "Unity 安装失败，退出码 $($install.ExitCode)。"
          }
          $version = (Get-Item -LiteralPath $editor).VersionInfo.ProductVersion
          if ($version -ne "${env:UNITY_VERSION}_${env:UNITY_REVISION}") {
            throw "Unity Editor 版本与 CI 配置不一致，实际版本为 $version。"
          }
          "UNITY_EDITOR=$editor" >> $env:GITHUB_ENV
      - name: 激活 Unity Editor
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          $license = Join-Path $env:RUNNER_TEMP 'RevGameCI.ulf'
          try {
            [IO.File]::WriteAllText($license, $env:UNITY_LICENSE)
            Remove-Item Env:UNITY_LICENSE
            $activationLog = Join-Path $env:RUNNER_TEMP 'RevGame-unity-license.log'
            $argsForUnity = @('-batchmode', '-nographics', '-quit', '-manualLicenseFile', ('"{0}"' -f $license), '-logFile', ('"{0}"' -f $activationLog))
            $activation = Start-Process -FilePath $env:UNITY_EDITOR -ArgumentList $argsForUnity -WindowStyle Hidden -PassThru -Wait
            if ($activation.ExitCode -ne 0) {
              Write-Output "::error title=Unity CI 激活失败::Unity 激活退出码 $($activation.ExitCode)。请核对 CI runner 授权。"
              exit 1
            }
          } finally {
            if (Test-Path -LiteralPath $license) { Remove-Item -LiteralPath $license }
          }
      - name: 编译 Unity 脚本并标注错误
        shell: pwsh
        run: |
          # 工程版本文件在仓库中忽略。CI 在本次检出内写入固定版本供首次导入使用。
          $versionFile = Join-Path $env:UNITY_PROJECT 'ProjectSettings/ProjectVersion.txt'
          @(
            "m_EditorVersion: $env:UNITY_VERSION"
            "m_EditorVersionWithRevision: $env:UNITY_VERSION ($env:UNITY_REVISION)"
          ) | Set-Content -LiteralPath $versionFile -Encoding utf8NoBOM
          python tools/UnityCI/compile.py --editor "$env:UNITY_EDITOR" --project "$env:UNITY_PROJECT" --log "$env:RUNNER_TEMP/RevGame-unity-compile.log" --github
          exit $LASTEXITCODE
