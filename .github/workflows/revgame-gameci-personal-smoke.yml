name: RevGame Unity 编译检查

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 选择普通导入验证或 Android 出包缓存预热
        type: choice
        default: editor
        options: [editor, android-cache]

permissions:
  contents: read

concurrency:
  group: revgame-unity-compile-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  import:
    name: Unity 脚本编译
    if: github.repository == 'Yokino337088/RevGame' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && inputs.target != 'android-cache'))
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      REVGAME_SMOKE_PROJECT: RevGame_Client/UnityProject/RevGame.Unity
      REVGAME_SMOKE_VERSION: 2022.3.15f1
      REVGAME_SMOKE_REVISION: b58023a2b463
    steps:
      # 外部 PR 在读取许可证和检出之前直接返回失败，维护者审查后可用仓库内分支送检。
      - name: 检查 PR 来源
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error title=外部 PR 需由维护者送检::请将审核通过的改动提交到 RevGame 仓库内的分支，再运行 Unity 编译。'
          exit 1

      - name: 检查 GameCI 个人版凭据
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error title=GameCI 个人版凭据缺失::请配置 Actions Secrets %s\n' "${missing[*]}"
            exit 1
          fi

      # PR 默认检出 GitHub 生成的合并候选提交，编译合并后的代码。
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 在本次检出准备国际版工程
        run: |
          project="$REVGAME_SMOKE_PROJECT"
          probe="$project/Assets/Editor/RevGameGameCiImportProbe.cs"
          test -f "$project/ProjectSettings/ProjectSettings.asset"
          test -d "$project/Assets/Editor"
          test ! -e "$probe"
          printf 'm_EditorVersion: %s\nm_EditorVersionWithRevision: %s (%s)\n' \
            "$REVGAME_SMOKE_VERSION" "$REVGAME_SMOKE_VERSION" "$REVGAME_SMOKE_REVISION" \
            > "$project/ProjectSettings/ProjectVersion.txt"
          cp tools/UnityCI/RevGameGameCiImportProbe.cs "$probe"

      - name: 云端编译运行时与编辑器脚本并导入启动场景
        # 固定支持 Node.js 24 的 GameCI v5.0.1 发布提交和 2022.3.15f1 Linux 编辑器镜像。
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.REVGAME_SMOKE_VERSION }}
          projectPath: ${{ env.REVGAME_SMOKE_PROJECT }}
          targetPlatform: StandaloneWindows64
          customImage: unityci/editor@sha256:85e36ba3d9143454fdca169d02c4549fc99671a596e06716d877b89df60a91e1
          buildMethod: RevGame.Editor.RevGameGameCiImportProbe.Verify
          versioning: None
          # 探针与版本文件只在本轮检出生成，允许 GameCI 使用这些预期写入。
          allowDirtyBuild: true

      - name: 核对 Unity 导入证据
        run: |
          receipt="$REVGAME_SMOKE_PROJECT/Library/RevGameGameCiImport.txt"
          if [[ ! -s "$receipt" ]]; then
            echo '::error title=RevGame 导入未验证::Unity 未生成本轮导入证据。'
            exit 1
          fi
          mapfile -t imported < "$receipt"
          if [[ "${imported[0]:-}" != "$REVGAME_SMOKE_VERSION" || ! "${imported[1]:-}" =~ ^[0-9a-f]{32}$ ]]; then
            echo '::error title=RevGame 导入结果不符::请检查实际编辑器版本和启动场景。'
            exit 1
          fi
          echo "RevGame 已在 Unity ${imported[0]} 完成脚本编译和启动场景导入。"

  android-cache:
    if: inputs.target == 'android-cache'
    uses: ./.github/workflows/revgame-gameci-personal-release.yml
    with:
      platform: android
      import_only: true
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
