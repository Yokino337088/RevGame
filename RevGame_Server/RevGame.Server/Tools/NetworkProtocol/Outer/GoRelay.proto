syntax = "proto3";
package Fantasy;

/// 一条经 Battle 校验并排序的围棋操作。
message GoRelayCommand
{
    int32 Sequence = 1;
    int32 Side = 2;
    int32 Kind = 3;
    int32 X = 4;
    int32 Y = 5;
    string Payload = 6;
    int64 ElapsedMs = 7;
    string PreviousHash = 8;
    string ResultHash = 9;
}
/// 首次同步和重连携带完整操作序列，协商后普通操作可只带最新一手。
message GoRelayState
{
    string RoomId = 1;
    string Phase = 2;
    int32 MySide = 3;
    string BlackName = 4;
    string WhiteName = 5;
    string CoreVersion = 6;
    string RulesJson = 7;
    repeated GoRelayCommand Commands = 8;
    int64 StartUtcMs = 9;
    int64 ServerUtcMs = 10;
    int64 ReconnectDeadlineUtcMs = 11;
    string Reason = 12;
    string MatchKind = 13;
    // 大于 0 时，Commands 只含 BaseSequence + 1 这一手。0 为完整快照。
    int32 BaseSequence = 14;
    // Battle 确认终局后给当前座位的本局分差，客户端按房间号应用一次。
    bool RatingFinalized = 15;
    int32 RatingDelta = 16;
    string DuelId = 17;
    bool DuelAvailable = 18;
}
/// 匿名身份只用于本次休闲联机；恢复令牌不可作为日志或公开昵称。
message C2G_GoHelloRequest // IRequest,G2C_GoHelloResponse
{
    string CoreVersion = 1;
    string Nickname = 2;
    string ResumeToken = 3;
    string RulesJson = 4;
    string MatchKind = 5;
    bool SupportsDelta = 6;
    int32 DuelFingerprint = 7;
}
message G2C_GoHelloResponse // IResponse
{
    string Token = 1;
    GoRelayState State = 2;
    string Reason = 3;
}
message C2G_GoMatchRequest // IRequest,G2C_GoMatchResponse
{
    bool Cancel = 1;
    // 本机棋力，仅用于本次排队。旧客户端缺省为 0，按初始分匹配。
    int32 LocalRating = 2;
}
message G2C_GoMatchResponse // IResponse
{
    GoRelayState State = 1;
    string Reason = 2;
}
message C2G_GoCommandRequest // IRequest,G2C_GoCommandResponse
{
    string RoomId = 1;
    GoRelayCommand Command = 2;
}
message G2C_GoCommandResponse // IResponse
{
    GoRelayState State = 1;
    string Reason = 2;
}
message C2G_GoSyncRequest // IRequest,G2C_GoSyncResponse
{
}
message G2C_GoSyncResponse // IResponse
{
    GoRelayState State = 1;
    string Reason = 2;
}
message C2G_GoLeaveRequest // IRequest,G2C_GoLeaveResponse
{
}
message G2C_GoLeaveResponse // IResponse
{
    GoRelayState State = 1;
    string Reason = 2;
}
message C2G_GoHeartbeatRequest // IRequest,G2C_GoHeartbeatResponse
{
}
message G2C_GoHeartbeatResponse // IResponse
{
    int64 ServerUtcMs = 1;
    string Reason = 2;
}
message G2C_GoState // IMessage
{
    GoRelayState State = 1;
}

// 原围棋房间内的决斗通道。Ready 与 Input 独立于围棋序号；FrameWords 只含完整封口帧。
message C2G_GoDuelRequest // IRequest,G2C_GoDuelResponse
{
    string RoomId = 1;
    int32 Operation = 2;
    int32 Fingerprint = 3;
    int32 AfterFrame = 4;
    int32 InputFrame = 5;
    int32 Input = 6;
}

message G2C_GoDuelResponse // IResponse
{
    string DuelId = 1;
    string Reason = 2;
    int32 ReadyMask = 3;
    int32 AfterFrame = 4;
    repeated int32 Frames = 5;
    int32 Result = 6;
    int32 FinalHash = 7;
}
