syntax = "proto3";
package Sining.Message;

// 协议分为:
// ProtoBuf:可以在Outer和Inner文件里使用。
// MemoryPack:可以在Outer和Inner文件里使用。

// 目前工具支持以下几种特殊用法:
// 在message协议上方添加// Protocol+空格+协议名字
// 例如: // Protocol ProtoBuf 或 // Protocol MemoryPack

// 分别代表使用Protobuf序列化或使用MemoryPack序列化
// 通过添加 // using 导出时添加自定义命名空间
// 例如: // using System.Runtime // using System.Reflection

// 大厅把同一房间的操作发往分配好的 Battle Scene。该消息不出现在客户端协议。
message GoBattleStepInput
{
    string RoomId = 1;
    int32 Komi = 2;
    int32 Sequence = 3;
    int32 Side = 4;
    int32 Kind = 5;
    int32 X = 6;
    int32 Y = 7;
    int64 ElapsedMs = 8;
    string Payload = 9;
    string PreviousHash = 10;
    string ResultHash = 11;
}

message GoBattleStepResult
{
    string Reason = 1;
    bool Finished = 2;
    int32 Winner = 3;
    int32 EndReason = 4;
    int32 DifferenceHalfPoints = 5;
}

// 同一批中的请求对应不同房间。结果按输入下标返回，单局错误不会影响其它房间。
message G2B_GoBatchRequest // IAddressRequest,B2G_GoBatchResponse
{
    repeated GoBattleStepInput Steps = 1;
}

message B2G_GoBatchResponse // IAddressResponse
{
    repeated GoBattleStepResult Results = 1;
}

message G2B_CloseGoRoom // IAddressMessage
{
    string RoomId = 1;
}

// 只由认证过的 Gate 填入席位和连接代际。围棋序号用于确认挑战评估的是已提交局面。
message G2B_GoDuelRequest // IAddressRequest,B2G_GoDuelResponse
{
    string RoomId = 1;
    int32 Side = 2;
    int64 SeatEpoch = 3;
    int32 BoardSequence = 4;
    int32 Operation = 5;
    int32 AfterFrame = 6;
    int32 InputFrame = 7;
    int32 Input = 8;
    int32 HashFrame = 9;
    int32 Hash = 10;
}

message B2G_GoDuelResponse // IAddressResponse
{
    G2C_GoDuelResponse State = 1;
}

// 断线或顶号会立即使旧连接的待执行输入失效。
message G2B_GoDuelSeatChanged // IAddressMessage
{
    string RoomId = 1;
    int32 Side = 2;
    int64 SeatEpoch = 3;
}

// 进程就绪时建立同 World 的内网连接，供棋局和决斗复用。
message G2B_GoBattleReadyRequest // IAddressRequest,B2G_GoBattleReadyResponse
{
}

message B2G_GoBattleReadyResponse // IAddressResponse
{
}

