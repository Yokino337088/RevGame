<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>围棋大作战</title>
  <style>
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #172620; color: #fcf4de; }
    body { font: 16px/1.65 system-ui, "Microsoft YaHei", sans-serif; }
    #game { position: fixed; inset: 0; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #172620; }
    #status, #file-guide, #exit { position: absolute; inset: 0; display: grid; place-items: center; }
    .panel { box-sizing: border-box; width: min(540px, calc(100vw - 48px)); padding: 28px; border: 1px solid #98825a; border-radius: 18px; background: #22352c; box-shadow: 0 10px 38px #0005; }
    .panel h1 { margin: 0 0 10px; font-size: 24px; }
    .panel p { margin: 0 0 14px; }
    .panel p:last-child { margin-bottom: 0; }
    progress { width: 100%; height: 10px; accent-color: #81c19a; }
    a { color: #e1cb92; }
    #restart { min-height: 44px; padding: 8px 24px; border: 1px solid #bdab79; border-radius: 9px; background: #e9d39b; color: #1a3029; font: inherit; font-weight: 700; cursor: pointer; }
    #exit { z-index: 3; background: #172620; }
    #fullscreen { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); right: max(12px, env(safe-area-inset-right)); border: 1px solid #ab996e; border-radius: 8px; padding: 7px 13px; color: #fcf4de; background: #22352de8; cursor: pointer; }
    #game:fullscreen #fullscreen { display: none; }
    #warnings { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); overflow-wrap: anywhere; }
    #warnings div { margin-bottom: 8px; border-radius: 8px; padding: 10px 15px; background: #654f28; }
    #warnings .error { background: #703931; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="status" role="status" hidden>
      <div class="panel">
        <h1>围棋大作战</h1>
        <p id="loading-text">正在加载游戏…</p>
        <progress id="progress" aria-label="加载进度" max="1" value="0"></progress>
      </div>
    </div>
    <div id="file-guide" hidden>
      <div class="panel">
        <h1>启动网页游戏</h1>
        <p>请通过 GitHub Pages 打开游戏。 <a href="https://yokino337088.github.io/RevGame/">在线试玩</a></p>
      </div>
    </div>
    <div id="warnings" role="alert"></div>
    <button id="fullscreen" type="button" hidden>全屏</button>
    <div id="exit" role="status" hidden>
      <div class="panel">
        <p id="exit-text">正在退出游戏…</p>
        <button id="restart" type="button" hidden>重新进入</button>
      </div>
    </div>
  </main>
  <script>
    (() => {
      const game = document.querySelector("#game");
      const canvas = document.querySelector("#unity-canvas");
      const status = document.querySelector("#status");
      const loadingText = document.querySelector("#loading-text");
      const progress = document.querySelector("#progress");
      const warnings = document.querySelector("#warnings");
      const fullscreen = document.querySelector("#fullscreen");

      // 本地文件入口只提示启动方式，避免在浏览器不允许读取资源时发出 Unity 下载请求。
      if (location.protocol === "file:") {
        canvas.hidden = true;
        document.querySelector("#file-guide").hidden = false;
        return;
      }

      const pageUrl = new URL(location.href);
      const restart = document.querySelector("#restart");
      restart.addEventListener("click", () => {
        pageUrl.searchParams.delete("exit");
        location.replace(pageUrl.href);
      });

      // 普通标签页拒绝脚本关闭时，导航到只显示已退出的状态，卸载整个旧 Player。
      if (pageUrl.searchParams.get("exit") === "1") {
        canvas.hidden = true;
        document.querySelector("#exit").hidden = false;
        document.querySelector("#exit-text").textContent = "已退出游戏";
        restart.hidden = false;
        return;
      }

      let unityInstance = null;
      let quitting = false;

      // 退出有独立的结束状态，浏览器保留当前标签页时也不会再自动加载 Player。
      async function quitGame() {
        if (quitting) {
          return;
        }
        quitting = true;
        document.querySelector("#exit").hidden = false;
        let timeout;
        try {
          if (unityInstance) {
            const limit = new Promise(resolve => { timeout = setTimeout(resolve, 1500); });
            await Promise.race([unityInstance.Quit(), limit]);
          }
        } catch (error) {
          console.warn("Unity Player 退出清理失败", error);
        } finally {
          clearTimeout(timeout);
          window.close();
          setTimeout(() => {
            if (!window.closed) {
              pageUrl.searchParams.set("exit", "1");
              location.replace(pageUrl.href);
            }
          }, 100);
        }
      }

      canvas.addEventListener("revgame:quit", quitGame);

      // 在真实点击回调内请求浏览器全屏。浏览器拒绝时画布继续铺满视口，按钮保留再次进入的入口。
      function enterFullscreen() {
        if (!document.fullscreenEnabled || !game.requestFullscreen || document.fullscreenElement) {
          return;
        }
        game.requestFullscreen().catch(() => {
          fullscreen.hidden = false;
        });
      }

      fullscreen.addEventListener("click", enterFullscreen);
      document.addEventListener("fullscreenchange", () => {
        fullscreen.hidden = Boolean(document.fullscreenElement) || !document.fullscreenEnabled;
      });

      // Unity 的诊断信息按纯文本显示。警告自动收起，错误保留供排查。
      function showBanner(message, type) {
        const item = document.createElement("div");
        item.className = type === "error" ? "error" : "warning";
        item.textContent = message;
        warnings.append(item);
        if (type !== "error") {
          setTimeout(() => item.remove(), 5000);
        }
      }

      // 加载器未能下载和 Player 未能初始化都保留一个可见的失败状态。
      function showFailure(message) {
        progress.hidden = true;
        loadingText.textContent = "游戏加载失败，请检查网页服务与构建文件。";
        showBanner(message, "error");
      }

      const buildUrl = "Build/";
      const streamingAssetsUrl = "StreamingAssets/6d4eb320222cf94b";
      const contentVersioned = /^StreamingAssets\/[a-f0-9]{16}$/.test(streamingAssetsUrl);
      const bundleRoot = new URL(streamingAssetsUrl + "/WebGL/", location.href);
      const buildRoot = new URL(buildUrl, location.href);
      let earlyBundlesStarted = false;

      // 版本目录内容固定，按需加载仍由 Unity 管理，浏览器可跨刷新复用已下载的静态响应。
      function cacheControl(address) {
        const url = new URL(address, location.href);
        if (url.origin !== location.origin) {
          return "no-store";
        }
        if (url.pathname.startsWith(bundleRoot.pathname)) {
          return contentVersioned ? "immutable" : "must-revalidate";
        }
        if (url.pathname.startsWith(buildRoot.pathname) && /^[a-f0-9]{16}$/.test(url.searchParams.get("v") || "")) {
          return "immutable";
        }
        return url.pathname.endsWith(".data.br") || url.pathname.endsWith(".data") ? "must-revalidate" : "no-store";
      }

      // 和 Wasm 编译重叠下载实际首屏所用的包。相同 URL 和 Fetch 模式可复用已发出的浏览器预载。
      function preloadEarlyBundles() {
        if (!contentVersioned || earlyBundlesStarted) {
          return;
        }
        earlyBundlesStarted = true;
        // 已运行过同一版的浏览器让 Unity 直接走持久缓存，避免预载另发一次网络请求。
        try {
          const marker = "RevGame.WebGL.BootBundles";
          if (localStorage.getItem(marker) === streamingAssetsUrl) {
            return;
          }
          localStorage.setItem(marker, streamingAssetsUrl);
        } catch {
          // 禁用站点存储时仍可按需加载。
        }
        for (const name of ["WebGL", "atlas_uiloading", "atlas_boardstatus", "font_cjk", "material_background", "shared_shaders", "ui_loading"]) {
          const link = document.createElement("link");
          link.rel = "preload";
          link.as = "fetch";
          link.crossOrigin = "anonymous";
          link.fetchPriority = "low";
          link.href = new URL(name, bundleRoot).href;
          document.head.append(link);
        }
      }

      const config = {
        dataUrl: buildUrl + "Web.data?v=32294102143f8305",
        frameworkUrl: buildUrl + "Web.framework.js?v=04f70c7c3ec4a435",
        codeUrl: buildUrl + "Web.wasm?v=cdd98e9b565e7abb",
        streamingAssetsUrl,
        cacheControl,
        companyName: "DefaultCompany",
        productName: "RevGame.Unity",
        productVersion: "1.0",
        showBanner,
      };
      status.hidden = false;
      const loader = document.createElement("script");
      loader.src = buildUrl + "Web.loader.js?v=75083a3271c601c2";
      loader.onerror = () => showFailure("无法读取 WebGL 加载器。");
      loader.onload = () => {
        createUnityInstance(canvas, config, (fraction) => {
          progress.value = fraction;
          if (fraction >= 0.2) {
            preloadEarlyBundles();
          }
        }).then((instance) => {
          unityInstance = instance;
          status.hidden = true;
          fullscreen.hidden = !document.fullscreenEnabled;
        }).catch(showFailure);
      };
      document.body.append(loader);
    })();
  </script>
</body>
</html>
